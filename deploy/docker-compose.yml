services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    # EIN Dockerfile fuer beide Wege (hier und codai up): es liegt im
    # Wurzelverzeichnis, weil nur von dort das Dashboard in das Image kopiert
    # werden kann. Vorher lag es in server/, und das Dashboard kam per
    # Host-Mount dazu — was ausserhalb dieses Compose nicht funktioniert.
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ORGA_PASSWORD: ${ORGA_PASSWORD}
      ORGA_SESSION_SECRET: ${ORGA_SESSION_SECRET}
      UPLOAD_DIR: /data/uploads
      DASHBOARD_DIR: /app/dashboard
    volumes:
      # Das Dashboard liegt im Image; der frueher hier stehende Mount
      # (../dashboard:/app/dashboard:ro) wuerde es nur durch dieselbe Datei
      # ersetzen und faellt damit weg.
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
