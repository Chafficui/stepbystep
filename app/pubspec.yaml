name: stepbystep_app
description: Teilnehmer-App für Walking-Events (StepByStep MVP).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  battery_plus: ^6.1.0
  flutter_local_notifications: ^17.2.2
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4
  connectivity_plus: ^6.0.3
  uuid: ^4.4.1
  http: ^1.2.2
  intl: ^0.20.3
  shared_preferences: ^2.3.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  fonts:
    - family: Saira
      fonts:
        - asset: assets/fonts/Saira-Regular.ttf
          weight: 400
        - asset: assets/fonts/Saira-Medium.ttf
          weight: 500
        - asset: assets/fonts/Saira-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Saira-Bold.ttf
          weight: 700
        - asset: assets/fonts/Saira-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Saira-ExtraBoldItalic.ttf
          weight: 800
          style: italic
